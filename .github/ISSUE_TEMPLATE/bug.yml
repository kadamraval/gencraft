name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gencraft version
      description: Shown in Settings, General, Updates, or open Help, then Support, and press Copy details (it never holds your keys).
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, macOS, Linux, Browser copy]
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Provider and model, if it is about a run. Never paste a key.
